<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c191a"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC5365"/>
      <stop offset="60%" stop-color="#e86b7c"/>
      <stop offset="100%" stop-color="#f8a5b0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.45"/>
  <!-- 3D Cube / Spatial Room wireframe -->
  <g transform="translate(256, 256)" stroke="url(#glow)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Isometric room cube -->
    <path d="M 0,-120 L 110,-56 L 0,8 L -110,-56 Z" fill="#DC5365" fill-opacity="0.25"/>
    <path d="M -110,-56 L 0,8 L 0,136 L -110,72 Z" fill="#DC5365" fill-opacity="0.15"/>
    <path d="M 110,-56 L 0,8 L 0,136 L 110,72 Z" fill="#b83c4d" fill-opacity="0.35"/>
    <!-- Wireframe edges -->
    <path d="M 0,-120 L 0,8" stroke-opacity="0.95"/>
    <path d="M -110,-56 L 0,8 L 110,-56" stroke-opacity="0.95"/>
    <circle cx="0" cy="8" r="8" fill="#ffffff" stroke="none"/>
  </g>
</svg>
